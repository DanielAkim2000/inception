services:
  mariadb:
    build: requirements/mariadb
    container_name: mariadb
    env_file: .env
    secrets:
      - db_password
      - db_root_password
    volumes:
      - mariadb_data:/var/lib/mysql
    networks:
      - inception
    restart: always

  wordpress:
    build: requirements/wordpress
    container_name: wordpress
    env_file: .env
    secrets:
      - db_password
    volumes:
      - wordpress_data:/var/www/html
    networks:
      - inception
    depends_on:
      - mariadb
    restart: always
  
  adminer:
    build: requirements/bonus
    container_name: adminer
    networks:
      - inception
    depends_on:
      - mariadb
    restart: always

  static:
      build: requirements/static
      container_name: static
      networks:
        - inception
      restart: always

  redis:
    build: requirements/redis
    container_name: redis
    networks:
      - inception
    restart: always

  ftp:
    build: requirements/ftp
    container_name: ftp
    env_file: .env
    ports:
      - "21:21"
      - "21000-21010:21000-21010"
    volumes:
      - wordpress_data:/var/www/html
    networks:
      - inception
    restart: always

  netdata:
    build: requirements/netdata
    container_name: netdata
    networks:
      - inception
    ports:
      - "19999:19999"
    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
    cap_add:
      - SYS_PTRACE
    security_opt:
      - apparmor:unconfined
    restart: always
  
  nginx:
    build: requirements/nginx
    container_name: nginx
    ports:
      - "443:443"
      - "8080:8080"
      - "8081:8081"
    volumes:
      - wordpress_data:/var/www/html
    networks:
      - inception
    depends_on:
      - wordpress
      - adminer
      - static
    restart: always

volumes:
  mariadb_data:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: /home/demane/data/mariadb
  wordpress_data:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: /home/demane/data/wordpress

networks:
  inception:
    driver: bridge

secrets:
  db_password:
    file: ../secrets/db_password.txt
  db_root_password:
    file: ../secrets/db_root_password.txt
